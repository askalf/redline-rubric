# After each Scorecard run: checks that its result reached scorecard.dev, and dispatches Scorecard
# once more when it did not. scorecard-action reports a failed publish as a warning on a green run,
# so a stale score would otherwise show nothing red. The check is askalf/ci's
# scorecard-publish-check action, called at a pinned commit.
# It is a workflow of its own because scorecard.dev accepts results only from a job whose steps it
# recognises, so the check cannot be a step of scorecard.yml.
name: Scorecard publish check

on:
  workflow_run:
    workflows: [Scorecard]
    types: [completed]

permissions: {}

jobs:
  check:
    # A failed run is already red.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # the one dispatch of the Scorecard workflow
    steps:
      - uses: askalf/ci/actions/scorecard-publish-check@00c95732d25ad90c842a901e52100b2993b2f4eb # main 2026-11-12, askalf/ci#213
