# Tests: the rubric this repository ships must hold against scripts/check-rubric.mjs, and the
# checker's own tests must pass, the property tests among them. Runs on every pull request and on
# main. The pull request's code runs here with a read-only token and no secrets.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image's Node is used as it is (the checker needs 20 or newer). The one
      # dependency, fast-check, is installed from the lockfile, with its install scripts off.
      - name: Install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The shipped rubric holds
        run: node scripts/check-rubric.mjs rubric.md
      - name: Tests
        run: npm test
