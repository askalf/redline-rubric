# Public text: fails a pull request that overuses em or en dashes across its added lines, title,
# description and commit messages, or whose title, description or a commit message credits a
# model or an AI tool. The check is askalf/ci's public-text.yml, called at a pinned commit; it
# reads the pull request through the API and checks out none of its code.
name: Public text

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-text:
    # The uses pin and redline-ref are one commit of askalf/ci's main; move them together.
    uses: askalf/ci/.github/workflows/public-text.yml@f5e6eda079607f787c800899f0d27ddc1f28f99f
    with:
      redline-ref: f5e6eda079607f787c800899f0d27ddc1f28f99f
